---

default:
  after_script:
    - |
      if [ -f "src/notify/tg.sh" ]; then
          chmod +x src/notify/tg.sh
          sh src/notify/tg.sh "$CI_JOB_STATUS"
      fi

stages:
  - lint
  - build
  - test
  - deploy

clangformatcheck:
  stage: lint
  image: ubuntu:latest
  before_script:
    - apt-get update && apt-get install -y clang-format curl
  script:
    - clang-format -i code-samples/*.c
    - clang-format --style=file -n --Werror code-samples/*.c

buildapp:
  stage: build
  image: alpine:latest
  before_script:
    - apk add --no-cache make gcc musl-dev curl
  script:
    - cd code-samples
    - make
  artifacts:
    paths:
      - code-samples/DO
    expire_in: 30 days

integrationtests:
  stage: test
  image: alpine:latest
  before_script:
    - apk add --no-cache bash curl
  script:
    - |
      cp code-samples/DO /usr/local/bin/do-app
      chmod +x /usr/local/bin/do-app
      chmod +x src/tests/integration.sh
      ./src/tests/integration.sh
  dependencies:
    - buildapp
  needs:
    - buildapp
    - clangformatcheck

deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client curl
  script:
    - |
      chmod +x src/deploy/deploy.sh
      sh src/deploy/deploy.sh
  dependencies:
    - buildapp
  needs:
    - buildapp
    - integrationtests
